# Reusable CI for a WMI service scaffolded from wmi-app-template.
#
# Called by a service's own .github/workflows/ci.yml. See the README, and
# ADR-0006 in waukesha-makers-architecture for why this lives here rather than
# copied into every service.
name: Service CI

on:
  workflow_call:
    inputs:
      db-name:
        description: MySQL database name. Letters, digits and underscore only.
        type: string
        required: true
      node-version:
        description: Node major version.
        type: string
        required: false
        default: '22'
      run-database-steps:
        description: >-
          Whether to create the database and apply migrations before the build.
          Set false in wmi-app-template itself, where db:ensure would only
          create a throwaway placeholder database and there are no migrations
          to apply. A real service should leave this true.
        type: boolean
        required: false
        default: true

jobs:
  build:
    name: Typecheck + lint + test + build
    runs-on: ${{ (github.repository_owner == 'WaukeshaMakerspace' && github.event.repository.private) && fromJSON('["self-hosted","hudson"]') || 'ubuntu-latest' }}

    # MySQL for DB-backed tests. Pure unit suites ignore it at no real cost;
    # the alternative is discovering the schema is broken at deploy time.
    # A `services:` block cannot be conditional, so this container also starts
    # when run-database-steps is false, where it simply idles.
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: password
        # Docker picks the host port: hudson runs both orgs' jobs on one
        # Docker daemon, so a fixed 3306 would collide with another job.
        ports:
          - 3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_NAME: ${{ inputs.db-name }}
      # The app validates these at startup; tests stub the actual calls.
      SESSION_SECRET: ci-session-secret-at-least-32-bytes!!
      KEYMASTER_CLIENT_ID: ci-dummy
      KEYMASTER_CLIENT_SECRET: ci-dummy
      KEYMASTER_API_KEY: km_ak_ci_dummy

    steps:
      - name: Point at the MySQL service port
        run: |
          port=${{ job.services.mysql.ports['3306'] }}
          echo "DATABASE_URL=mysql://root:password@127.0.0.1:$port" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
      - run: npm ci

      - name: Ensure the database exists
        if: inputs.run-database-steps
        run: npm run db:ensure

      # A freshly scaffolded service has no migrations until someone runs
      # `db:generate`, and wmi-db-migrate exits 1 on a missing folder. Without
      # this guard every new service fails CI on its first push, before it has
      # defined a single table.
      - name: Apply migrations, if any exist yet
        if: inputs.run-database-steps
        run: |
          if [ -d packages/database/migrations ]; then
            npm run db:migrate
          else
            echo "No migrations directory yet, skipping."
          fi

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
